<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#ffffff"
  >

  <meta
    name="description"
    content="Church attendance and check-in for Living Faith Nepali Church Koramangala Bangalore."
  >

  <link rel="manifest" href="./manifest.json">

  <title>LFNC Church Check-In</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #222;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
    }

    .app {
      width: 100%;
      max-width: 520px;
      min-height: 100vh;
      background: #ffffff;
      padding: 24px 18px 40px;
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .logo {
      width: 110px;
      height: 110px;
      object-fit: contain;
      display: block;
      margin: 0 auto 14px;
    }

    h1 {
      font-size: 23px;
      line-height: 1.3;
      margin: 0 0 8px;
    }

    .service {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .address {
      font-size: 13px;
      line-height: 1.5;
      color: #666;
    }

    .card {
      background: #ffffff;
      border: 1px solid #e1e5eb;
      border-radius: 16px;
      padding: 20px;
      margin-top: 18px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
    }

    .card h2 {
      margin: 0 0 16px;
      font-size: 19px;
    }

    label {
      display: block;
      font-weight: bold;
      font-size: 14px;
      margin: 14px 0 7px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #cfd5dd;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
      background: #ffffff;
    }

    input:focus {
      border-color: #555;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 11px;
      padding: 15px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 18px;
      background: #111111;
      color: #ffffff;
      -webkit-tap-highlight-color: transparent;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .secondary {
      background: #eeeeee;
      color: #222222;
    }

    .message {
      margin-top: 16px;
      padding: 12px;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.5;
      display: none;
      word-break: break-word;
    }

    .message.show {
      display: block;
    }

    .message.success {
      background: #e8f7e8;
      color: #176b17;
    }

    .message.error {
      background: #fdecec;
      color: #9b1c1c;
    }

    .member-card {
      display: none;
    }

    .member-info {
      line-height: 1.7;
      font-size: 15px;
    }

    .member-id {
      font-weight: bold;
    }

    .footer {
      text-align: center;
      color: #777777;
      font-size: 12px;
      margin-top: 28px;
      line-height: 1.5;
    }

    .loading-overlay {
      position: fixed;
      inset: 0;
      background: rgba(255, 255, 255, 0.94);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      padding: 30px;
      text-align: center;
    }

    .loading-overlay.show {
      display: flex;
    }

    .loading-box {
      max-width: 320px;
      font-size: 16px;
      line-height: 1.5;
    }

    .spinner {
      width: 42px;
      height: 42px;
      border: 4px solid #dddddd;
      border-top-color: #111111;
      border-radius: 50%;
      margin: 0 auto 16px;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /*
     * IMPORTANT:
     * These iframes are visually hidden but NOT display:none.
     * Android Chrome can be unreliable with POST targets
     * when the target iframe is display:none.
     */
    .api-frame {
      position: fixed;
      width: 1px;
      height: 1px;
      border: 0;
      opacity: 0;
      pointer-events: none;
      left: -10px;
      top: -10px;
    }

  </style>

</head>


<body>

  <div class="app">

    <div class="header">

      <img
        class="logo"
        src="./icons/icon-192.png"
        alt="Living Faith Nepali Church logo"
      >

      <h1>
        Living Faith Nepali Church<br>
        Koramangala Bangalore
      </h1>

      <div class="service">
        Sunday Service
      </div>

      <div class="address">
        5th Floor, Kay Arr Cornerstone,<br>
        Maharaja Signal, 80 Feet Road,<br>
        Koramangala 4th Block,<br>
        Bengaluru 560034
      </div>

    </div>


    <!-- REGISTRATION -->

    <div
      class="card"
      id="registrationCard"
    >

      <h2>
        Register & Check In
      </h2>


      <label for="name">
        Name
      </label>

      <input
        id="name"
        type="text"
        placeholder="Enter your name"
        autocomplete="name"
      >


      <label for="mobile">
        Mobile Number
      </label>

      <input
        id="mobile"
        type="tel"
        placeholder="Enter your mobile number"
        autocomplete="tel"
      >


      <label for="location">
        Location
      </label>

      <input
        id="location"
        type="text"
        placeholder="Example: Koramangala"
        autocomplete="address-level2"
      >


      <button
        id="registerButton"
        type="button"
      >
        REGISTER & CHECK IN
      </button>


      <div
        id="registrationMessage"
        class="message"
      ></div>

    </div>


    <!-- MEMBER -->

    <div
      class="card member-card"
      id="memberCard"
    >

      <h2>
        Welcome
      </h2>


      <div
        class="member-info"
        id="memberInfo"
      ></div>


      <button
        id="checkInButton"
        type="button"
      >
        CHECK IN
      </button>


      <button
        id="forgetButton"
        class="secondary"
        type="button"
      >
        THIS IS NOT ME
      </button>


      <div
        id="checkInMessage"
        class="message"
      ></div>

    </div>


    <div class="footer">
      Fresh location verification is required for every check-in.
    </div>

  </div>


  <!-- API IFRAMES ARE CREATED DYNAMICALLY -->


  <!-- LOADING -->

  <div
    class="loading-overlay"
    id="loadingOverlay"
  >

    <div class="loading-box">

      <div class="spinner"></div>

      <div id="loadingText">
        Checking your location...
      </div>

    </div>

  </div>


  <script>

    /************************************************
     * CONFIGURATION
     ************************************************/

    const APPS_SCRIPT_URL =
      "https://script.google.com/macros/s/AKfycbwRQpqB5xLZJ5XD2qd3wOHeoA6W8b9KebrFaNb1HSQ9GkwsXicepPDYSsNjP66yfN9S1w/exec";


    const MEMBER_KEY =
      "churchMemberId";


    /************************************************
     * DOM
     ************************************************/

    const registrationCard =
      document.getElementById(
        "registrationCard"
      );

    const memberCard =
      document.getElementById(
        "memberCard"
      );

    const registerButton =
      document.getElementById(
        "registerButton"
      );

    const checkInButton =
      document.getElementById(
        "checkInButton"
      );

    const forgetButton =
      document.getElementById(
        "forgetButton"
      );


    /************************************************
     * BUTTON EVENTS
     ************************************************/

    registerButton.addEventListener(
      "click",
      function () {

        registerMember();

      }
    );


    checkInButton.addEventListener(
      "click",
      function () {

        checkIn();

      }
    );


    forgetButton.addEventListener(
      "click",
      function () {

        forgetMember();

      }
    );


    /************************************************
     * API POST
     *
     * Each request gets its OWN iframe.
     * This prevents requests from overwriting
     * each other's callbacks.
     ************************************************/

    function apiPost(
      action,
      data
    ) {

      return new Promise(
        function (resolve, reject) {

          var frameName =
            "apiFrame_" +
            Date.now() +
            "_" +
            Math.floor(
              Math.random() * 100000
            );


          var iframe =
            document.createElement(
              "iframe"
            );


          iframe.name =
            frameName;

          iframe.className =
            "api-frame";


          document.body.appendChild(
            iframe
          );


          var form =
            document.createElement(
              "form"
            );


          form.method =
            "POST";

          form.action =
            APPS_SCRIPT_URL;

          form.target =
            frameName;

          form.style.display =
            "none";


          var payload =
            document.createElement(
              "input"
            );


          payload.type =
            "hidden";

          payload.name =
            "payload";

          payload.value =
            JSON.stringify({

              action:
                action,

              data:
                data || {}

            });


          /*
           * The Apps Script backend currently
           * reads the action/data from the root
           * payload object.
           *
           * Therefore create the payload in
           * the exact format expected by doPost().
           */

          var requestPayload = {

            action:
              action,

            name:
              data && data.name
                ? data.name
                : undefined,

            mobile:
              data && data.mobile
                ? data.mobile
                : undefined,

            location:
              data && data.location
                ? data.location
                : undefined,

            latitude:
              data && data.latitude !== undefined
                ? data.latitude
                : undefined,

            longitude:
              data && data.longitude !== undefined
                ? data.longitude
                : undefined,

            accuracy:
              data && data.accuracy !== undefined
                ? data.accuracy
                : undefined,

            memberId:
              data && data.memberId
                ? data.memberId
                : undefined

          };


          payload.value =
            JSON.stringify(
              requestPayload
            );


          form.appendChild(
            payload
          );


          document.body.appendChild(
            form
          );


          var completed =
            false;


          function cleanup() {

            try {

              if (
                form &&
                form.parentNode
              ) {

                form.parentNode.removeChild(
                  form
                );

              }

              if (
                iframe &&
                iframe.parentNode
              ) {

                iframe.parentNode.removeChild(
                  iframe
                );

              }

            } catch (error) {

              console.log(
                "Cleanup error:",
                error
              );

            }

          }


          function success(result) {

            if (completed) {
              return;
            }

            completed = true;

            cleanup();

            resolve(result);

          }


          function failure(message) {

            if (completed) {
              return;
            }

            completed = true;

            cleanup();

            reject(
              new Error(message)
            );

          }


          /*
           * Each request gets a unique message
           * listener.
           */

          function messageHandler(
            event
          ) {

            if (
              !event.data ||
              event.data.type !==
                "LFNC_ATTENDANCE_RESULT"
            ) {

              return;

            }


            window.removeEventListener(
              "message",
              messageHandler
            );


            success(
              event.data.result
            );

          }


          window.addEventListener(
            "message",
            messageHandler
          );


          /*
           * Safety timeout.
           */

          setTimeout(
            function () {

              window.removeEventListener(
                "message",
                messageHandler
              );


              if (!completed) {

                failure(
                  "The server did not respond. Please check your internet connection and try again."
                );

              }

            },
            30000
          );


          try {

            form.submit();

          } catch (error) {

            window.removeEventListener(
              "message",
              messageHandler
            );

            failure(
              error.message
            );

          }

        }
      );

    }


    /************************************************
     * LOADING
     ************************************************/

    function showLoading(
      message
    ) {

      document.getElementById(
        "loadingText"
      ).textContent =
        message;


      document.getElementById(
        "loadingOverlay"
      ).classList.add(
        "show"
      );

    }


    function hideLoading() {

      document.getElementById(
        "loadingOverlay"
      ).classList.remove(
        "show"
      );

    }


    /************************************************
     * MESSAGES
     ************************************************/

    function showMessage(
      elementId,
      message,
      success
    ) {

      var element =
        document.getElementById(
          elementId
        );


      element.textContent =
        message || "";


      element.className =
        "message show " +
        (
          success
            ? "success"
            : "error"
        );

    }


    /************************************************
     * GPS
     ************************************************/

    function getLocation() {

      return new Promise(
        function (resolve) {

          if (
            !navigator.geolocation
          ) {

            resolve({

              success: false,

              message:
                "GPS is not supported on this device."

            });

            return;

          }


          var finished =
            false;


          function finish(
            result
          ) {

            if (finished) {
              return;
            }


            finished = true;

            resolve(result);

          }


          /*
           * Safety timer.
           */

          var safetyTimer =
            setTimeout(
              function () {

                finish({

                  success: false,

                  message:
                    "Location request timed out. Please make sure Location is ON and try again."

                });

              },
              35000
            );


          navigator.geolocation.getCurrentPosition(

            function (position) {

              clearTimeout(
                safetyTimer
              );


              finish({

                success: true,

                latitude:
                  position.coords.latitude,

                longitude:
                  position.coords.longitude,

                accuracy:
                  position.coords.accuracy

              });

            },


            function (error) {

              clearTimeout(
                safetyTimer
              );


              var message =
                "Unable to get your location.";


              if (
                error.code === 1
              ) {

                message =
                  "Location permission was denied. Please allow location access and try again.";

              }


              else if (
                error.code === 2
              ) {

                message =
                  "Your location could not be determined. Please try again.";

              }


              else if (
                error.code === 3
              ) {

                message =
                  "Location request timed out. Please try again.";

              }


              finish({

                success: false,

                message:
                  message

              });

            },


            {

              enableHighAccuracy:
                true,

              timeout:
                30000,

              maximumAge:
                0

            }

          );

        }
      );

    }


    /************************************************
     * REGISTER MEMBER
     ************************************************/

    async function registerMember() {

      var name =
        document.getElementById(
          "name"
        ).value.trim();


      var mobile =
        document.getElementById(
          "mobile"
        ).value.trim();


      var location =
        document.getElementById(
          "location"
        ).value.trim();


      /******** VALIDATION ********/

      if (!name) {

        showMessage(
          "registrationMessage",
          "Please enter your name.",
          false
        );

        return;

      }


      if (!mobile) {

        showMessage(
          "registrationMessage",
          "Please enter your mobile number.",
          false
        );

        return;

      }


      if (!location) {

        showMessage(
          "registrationMessage",
          "Please enter your location.",
          false
        );

        return;

      }


      /******** DISABLE ********/

      registerButton.disabled =
        true;


      showLoading(
        "Checking your location..."
      );


      try {

        /******** GPS ********/

        var gps =
          await getLocation();


        if (!gps.success) {

          hideLoading();

          showMessage(
            "registrationMessage",
            gps.message,
            false
          );

          registerButton.disabled =
            false;

          return;

        }


        /******** SERVER ********/

        showLoading(
          "Registering and checking you in..."
        );


        var result =
          await apiPost(

            "registerAndCheckIn",

            {

              name:
                name,

              mobile:
                mobile,

              location:
                location,

              latitude:
                gps.latitude,

              longitude:
                gps.longitude,

              accuracy:
                gps.accuracy

            }

          );


        hideLoading();


        /******** RESULT ********/

        if (
          !result ||
          !result.success
        ) {

          showMessage(

            "registrationMessage",

            result &&
            result.message

              ? result.message

              : "Registration failed. Please try again.",

            false

          );


          registerButton.disabled =
            false;


          return;

        }


        /******** SAVE MEMBER ********/

        if (
          result.member &&
          result.member.memberId
        ) {

          localStorage.setItem(

            MEMBER_KEY,

            result.member.memberId

          );


          showMember(
            result.member
          );

        }


        showMessage(

          "checkInMessage",

          result.message ||
            "Registration and check-in successful.",

          true

        );


        registerButton.disabled =
          false;


      } catch (error) {

        hideLoading();


        showMessage(

          "registrationMessage",

          error.message ||
            "Unable to connect to the server.",

          false

        );


        registerButton.disabled =
          false;

      }

    }


    /************************************************
     * CHECK IN
     ************************************************/

    async function checkIn() {

      var memberId =
        localStorage.getItem(
          MEMBER_KEY
        );


      if (!memberId) {

        forgetMember();

        return;

      }


      checkInButton.disabled =
        true;


      showLoading(
        "Checking your location..."
      );


      try {

        /******** GPS ********/

        var gps =
          await getLocation();


        if (!gps.success) {

          hideLoading();

          showMessage(

            "checkInMessage",

            gps.message,

            false

          );


          checkInButton.disabled =
            false;


          return;

        }


        /******** CHECK IN ********/

        showLoading(
          "Checking you in..."
        );


        var result =
          await apiPost(

            "checkInMember",

            {

              memberId:
                memberId,

              latitude:
                gps.latitude,

              longitude:
                gps.longitude,

              accuracy:
                gps.accuracy

            }

          );


        hideLoading();


        /******** RESULT ********/

        if (
          !result ||
          !result.success
        ) {

          showMessage(

            "checkInMessage",

            result &&
            result.message

              ? result.message

              : "Check-in failed. Please try again.",

            false

          );


          checkInButton.disabled =
            false;


          return;

        }


        showMessage(

          "checkInMessage",

          result.message ||
            "Check-in successful!",

          true

        );


        checkInButton.disabled =
          false;


      } catch (error) {

        hideLoading();


        showMessage(

          "checkInMessage",

          error.message ||
            "Unable to connect to the server.",

          false

        );


        checkInButton.disabled =
          false;

      }

    }


    /************************************************
     * SHOW MEMBER
     ************************************************/

    function showMember(
      member
    ) {

      registrationCard.style.display =
        "none";


      memberCard.style.display =
        "block";


      document.getElementById(
        "memberInfo"
      ).innerHTML =

        "<strong>" +
        escapeHtml(
          member.name || ""
        ) +
        "</strong><br>" +

        "Member ID: " +

        "<span class='member-id'>" +

        escapeHtml(
          member.memberId || ""
        ) +

        "</span><br>" +

        "Mobile: " +

        escapeHtml(
          member.mobile || ""
        ) +

        "<br>" +

        "Location: " +

        escapeHtml(
          member.location || ""
        );

    }


    /************************************************
     * LOAD SAVED MEMBER
     ************************************************/

    async function loadSavedMember() {

      var memberId =
        localStorage.getItem(
          MEMBER_KEY
        );


      if (!memberId) {
        return;
      }


      try {

        var member =
          await apiPost(

            "getMember",

            {

              memberId:
                memberId

            }

          );


        if (
          member &&
          member.memberId
        ) {

          showMember(
            member
          );

        } else {

          localStorage.removeItem(
            MEMBER_KEY
          );

        }

      } catch (error) {

        /*
         * If the server is temporarily
         * unavailable, don't delete the
         * saved member ID.
         */

        console.log(
          "Could not load saved member:",
          error
        );

      }

    }


    /************************************************
     * FORGET MEMBER
     ************************************************/

    function forgetMember() {

      localStorage.removeItem(
        MEMBER_KEY
      );


      memberCard.style.display =
        "none";


      registrationCard.style.display =
        "block";


      document.getElementById(
        "name"
      ).value = "";


      document.getElementById(
        "mobile"
      ).value = "";


      document.getElementById(
        "location"
      ).value = "";


      document.getElementById(
        "registrationMessage"
      ).className =
        "message";


      document.getElementById(
        "checkInMessage"
      ).className =
        "message";

    }


    /************************************************
     * HTML ESCAPE
     ************************************************/

    function escapeHtml(
      text
    ) {

      return String(text)

        .replace(
          /&/g,
          "&amp;"
        )

        .replace(
          /</g,
          "&lt;"
        )

        .replace(
          />/g,
          "&gt;"
        )

        .replace(
          /"/g,
          "&quot;"
        )

        .replace(
          /'/g,
          "&#039;"
        );

    }


    /************************************************
     * SERVICE WORKER
     ************************************************/

    if (
      "serviceWorker" in navigator
    ) {

      window.addEventListener(
        "load",
        function () {

          navigator.serviceWorker

            .register(
              "./sw.js"
            )

            .then(
              function () {

                console.log(
                  "LFNC service worker registered."
                );

              }
            )

            .catch(
              function (error) {

                console.log(
                  "Service worker registration failed:",
                  error
                );

              }
            );

        }
      );

    }


    /************************************************
     * START
     ************************************************/

    window.addEventListener(
      "load",
      function () {

        loadSavedMember();

      }
    );

  </script>

</body>

</html>
